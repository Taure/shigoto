[changelog]
# Text written by hand goes here: the header is the one part of CHANGELOG.md
# that is not derived from commits, and release notes are generated without it.
header = """
# Changelog\n
Generated from the commit history by [git-cliff](https://git-cliff.org), so an
edit made here is lost. To change it, regenerate it:\n
```
git cliff -o CHANGELOG.md
```\n
and commit the result as `chore(changelog): regenerate`, the last commit of
the pull request. CI fails a pull request whose file differs.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(changelog\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI" },
]
filter_commits = false
tag_pattern = "v[0-9].*"

[bump]
initial_tag = "v1.0.0"
