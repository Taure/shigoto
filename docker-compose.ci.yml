services:
  postgres:
    image: postgres:${SHIGOTO_PG_VERSION:-16}
    environment:
      POSTGRES_DB: shigoto_test
      POSTGRES_PASSWORD: root
      # Under the tmpfs on every major: 18 moved the image's data directory.
      PGDATA: /var/lib/postgresql/pgdata
    ports:
      - "5556:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "shigoto_test"]
      interval: 1s
      timeout: 3s
      retries: 60
